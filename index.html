<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>成都 ↔ 海安 夜间动卧方案</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><i></i><span></span></div>
        <div>
          <h1>成都 <span>↔</span> 海安</h1>
        </div>
      </div>
      <div class="header-actions">
        <label class="switch-control">
          <input id="hideTight" type="checkbox">
          <span class="switch-track"><span></span></span>
          <span>隐藏紧张换乘</span>
        </label>
        <button id="todayBtn" class="ghost-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v5h5"/></svg>
          回到本周
        </button>
      </div>
    </header>

    <main>
      <section id="planner" class="planner" aria-live="polite"></section>
    </main>
  </div>

  <div id="tripModal" class="modal" aria-hidden="true">
    <button class="modal-backdrop" type="button" aria-label="关闭详情"></button>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
